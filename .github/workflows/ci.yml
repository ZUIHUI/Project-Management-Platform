name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime and OpenAPI operations
        run: npm --workspace apps/api run test:contract:gate

      - name: Verify architecture boundaries
        run: npm --workspace apps/api run test:architecture

      - name: Verify database test safety guard
        run: npm --workspace apps/api run test:db:guard

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/project_management_test
        run: npm --workspace apps/api run db:generate

      - name: Typecheck API boundaries
        run: npm --workspace apps/api run typecheck

      - name: Verify generated API types
        run: npm --workspace apps/web run check:api-generated

      - name: Typecheck web contracts
        run: npm --workspace apps/web run typecheck

      - name: Test authentication transport
        run: npm --workspace apps/web run test:auth

      - name: Test UI route and request state
        run: npm --workspace apps/web run test:ui-state

      - name: Lint web
        run: npm --workspace apps/web run lint

      - name: Build web
        run: npm --workspace apps/web run build

  postgres-runtime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: project_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/project_management_test
      JWT_SECRET: ci-only-access-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL contract, integration, and smoke tests
        run: npm --workspace apps/api run test:db
